<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieBox — Cinema, unboxed</title>
<meta name="theme-color" content="#0a0d1a">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="MovieBox home">
    <img src="/assets/icon.svg" alt="" width="34" height="34" class="brand-logo">
    <span class="brand-name">Movie<em>Box</em></span>
  </a>
  <nav class="mainnav" id="mainnav" aria-label="Primary">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/browse" data-nav="browse">Browse</a>
    <a href="#/search" data-nav="search">Search</a>
    <a href="#/list" data-nav="list">My List</a>
    <a href="#/ai" data-nav="ai">AI Hub</a>
    <a href="#/history" data-nav="history">History</a>
  </nav>
  <div class="topbar-actions">
    <button class="icon-btn" id="quick-search-btn" title="Search (/)" aria-label="Search">⌕</button>
    <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings">⚙</a>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<!-- Quick search overlay -->
<div class="qs-overlay" id="qs-overlay" hidden>
  <div class="qs-panel">
    <input id="qs-input" type="search" placeholder="Search movies, shows… (Esc to close)"
           autocomplete="off" spellcheck="false" aria-label="Quick search">
    <div id="qs-results" class="qs-results" aria-live="polite"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<footer class="footer">
  <img src="/assets/icon.svg" alt="" width="20" height="20">
  <span>MovieBox <span id="ver"></span> · your private cinema · local-first AI</span>
</footer>

<noscript><div class="noscript">MovieBox needs JavaScript enabled.</div></noscript>
<script src="/assets/app.js"></script>
<script src="/assets/views.js"></script>
</body>
</html>
