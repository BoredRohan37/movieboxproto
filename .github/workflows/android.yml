name: Android Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: android-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ndk: $ANDROID_NDK_LATEST_HOME"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build TUI (termux-friendly)
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo ndk --platform 21 --target ${{ matrix.target }} \
            build --release --locked --bin moviebox-tui

      - name: Stage package
        run: |
          stage="stage/MovieBox_Android_${{ matrix.arch }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/moviebox-tui" "$stage/"
          cp README.md "$stage/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          MovieBox — Android (Termux) edition
          ===================================
          1. Install Termux (F-Droid build recommended).
          2. Copy this folder to your device storage.
          3. In Termux:
             pkg install mpv
             chmod +x moviebox-tui
             ./moviebox-tui
          EOF
          (cd stage && zip -r "../MovieBox_Android_${{ matrix.arch }}.zip" "$(basename $stage)")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}
          path: "*.zip"
          if-no-files-found: error
